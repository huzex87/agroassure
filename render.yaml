# The gateway, defined here rather than clicked together in a dashboard.
#
# Render reads this from the repository root, so the service can be recreated
# from scratch and a change to how it runs arrives as a reviewed diff instead of
# a setting somebody remembers changing.
#
# Deliberately not a free plan. The gateway keeps two timers running — the
# projector sweep and the escalation worker — and a free instance is stopped
# when nobody is using it. Projections would then only advance when somebody
# happened to open a page, and a finding would never pass its due date into
# escalation, which is the one thing the corrective-action clock exists to do.
#
# Every secret below is sync:false: Render prompts for it once and keeps it, so
# no credential is ever written into this file.

services:
  - type: web
    name: agroassure-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: ohio            # co-located with the Supabase project and the evidence bucket
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      # Turns on the refusals in config.ts: no development sign-in, a real
      # identity provider, object-locked evidence, the separate verify role, and
      # a database connection that is authenticated and not merely encrypted.
      - key: APP_ENV
        value: pilot

      - key: PORT
        value: "3001"

      # -- database ------------------------------------------------------------
      # Supabase's session pooler, not the direct host: that one is IPv6-only and
      # will not resolve from here.
      - key: DATABASE_URL
        sync: false
      # The same database as public_verify.<project-ref>, a role that holds
      # SELECT on one view and is refused on every table.
      - key: PUBLIC_VERIFY_DATABASE_URL
        sync: false
      # The provider's CA, pasted whole. Without it the connection is encrypted
      # but unauthenticated, and the service refuses to start.
      - key: PGSSLROOTCERT_PEM
        sync: false

      # -- who anyone is -------------------------------------------------------
      # The issuer is all that is needed: the endpoints and the key set come from
      # its discovery document.
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false

      # -- staff sign-in by email link -----------------------------------------
      # Instead of (or beside) OIDC: staff type their work email and receive a
      # one-time link. CONSOLE_URL is the console's address; the secret signs
      # console sessions (32+ characters). Using email instead of OIDC also
      # means leaving AUTH_JWT_SECRET unset — the pilot refuses to start with it.
      - key: CONSOLE_URL
        sync: false
      - key: CONSOLE_SESSION_SECRET
        sync: false

      # -- inspectors' phones -------------------------------------------------
      # Signs the session a phone gets when it spends an invite code. At least
      # 32 characters; without it the console can still list the team, but no
      # phone can be set up. Rotating it signs every phone out.
      - key: DEVICE_TOKEN_SECRET
        sync: false
      # Where the field app is downloaded from, quoted in every invitation.
      - key: FIELD_APP_DOWNLOAD_URL
        sync: false
      # Invite codes go out by email and SMS. Unset, a pilot sends nothing and
      # the console shows each code for the administrator to pass on.
      #   EMAIL_PROVIDER: resend | sendgrid     (+ EMAIL_API_KEY, EMAIL_FROM)
      #   SMS_PROVIDER:   termii | africastalking | twilio
      #                   (+ SMS_API_KEY, SMS_SENDER_ID; SMS_ACCOUNT for the last two)
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_ACCOUNT
        sync: false
      # People asking to join (phone app and the console's Request access
      # page). Off by default: administrators invite their own staff. Set to
      # "on" to also let people ask; it then opens whenever both an email and
      # an SMS provider are set, and every request still waits for an
      # administrator's approval.
      - key: SELF_REGISTRATION
        value: "off"
      # You, the owner. On every start the gateway makes sure this email is a
      # national administrator (adding the state if missing), so a new
      # deployment has someone who can sign in and approve everyone else.
      # Safe to leave set: it only fills in what is missing.
      - key: FIRST_ADMIN_EMAIL
        sync: false
      - key: FIRST_ADMIN_NAME
        sync: false
      - key: FIRST_ADMIN_STATE
        sync: false

      # -- evidence ------------------------------------------------------------
      - key: EVIDENCE_STORE
        value: s3
      - key: EVIDENCE_S3_BUCKET
        sync: false
      - key: EVIDENCE_S3_REGION
        sync: false
      - key: EVIDENCE_S3_ACCESS_KEY_ID
        sync: false
      - key: EVIDENCE_S3_SECRET_ACCESS_KEY
        sync: false
      # A records-retention decision belonging to the regulator, not a default:
      # once an object is written it cannot be shortened.
      - key: EVIDENCE_RETENTION_YEARS
        value: "7"

      # -- the public surface --------------------------------------------------
      - key: PUBLIC_VERIFY_BASE_URL
        sync: false
      # ponytail: the limiter counts in this process's memory, which is correct
      # for one instance and wrong for two. Move it to Redis or the edge before
      # scaling out, not before.
      - key: PUBLIC_VERIFY_RATE_PER_MINUTE
        value: "60"
