name: CI

# Lint, type-check, unit tests, and — the parts that matter most here — the
# schema invariants and a full inspection lifecycle run against a real
# PostgreSQL. The certificate invariant and the append-only event store are
# database constraints, and the projector is SQL, so a suite that never touches
# a database would not be testing any of them.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agroassure
          POSTGRES_PASSWORD: agroassure
          POSTGRES_DB: agroassure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agroassure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://agroassure:agroassure@localhost:5432/agroassure
      AUTH_JWT_SECRET: ci-secret-not-used-in-production
      PGPASSWORD: agroassure

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      # Node 24: the field-core suite drives the device store through
      # node:sqlite, which is not available on Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the shared packages
        run: |
          pnpm --filter @agroassure/domain build
          pnpm --filter @agroassure/field-core build

      - name: Type-check every package
        run: pnpm -r run typecheck

      - name: Unit tests
        run: pnpm -r run test

      - name: Apply migrations (forward-only) and the pilot fixture
        run: node db/migrate.mjs --seed

      - name: Migrations are idempotent to re-run
        run: node db/migrate.mjs

      - name: Schema invariants hold against a real database
        run: node db/verify-invariants.mjs

      # A separate, disposable database: the lifecycle suite appends events that
      # cannot be deleted afterwards and rebuilds every projection.
      - name: Prepare a disposable database for the lifecycle suite
        run: |
          psql -h localhost -U agroassure -d agroassure -c 'CREATE DATABASE agroassure_it'
          DATABASE_URL=postgres://agroassure:agroassure@localhost:5432/agroassure_it \
            node db/migrate.mjs

      - name: A full inspection lifecycle, device to public page
        env:
          DATABASE_URL: postgres://agroassure:agroassure@localhost:5432/agroassure_it
          ALLOW_DESTRUCTIVE_TEST_DB: "1"
        run: pnpm --filter @agroassure/sync-gateway run test:integration
