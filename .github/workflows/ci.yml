name: CI

# Lint, type-check, unit tests, and — the parts that matter most here — the
# schema invariants and a full inspection lifecycle run against a real
# PostgreSQL. The certificate invariant and the append-only event store are
# database constraints, and the projector is SQL, so a suite that never touches
# a database would not be testing any of them.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agroassure
          POSTGRES_PASSWORD: agroassure
          POSTGRES_DB: agroassure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agroassure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # Real S3 with real object-lock. The claim that an exhibit cannot be
      # destroyed is a property of the storage, so it is tested against storage
      # that implements it rather than against a mock that agrees with us.
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: agroassure
          MINIO_ROOT_PASSWORD: agroassure-local-verification
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local || curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgres://agroassure:agroassure@localhost:5432/agroassure
      AUTH_JWT_SECRET: ci-secret-not-used-in-production
      PGPASSWORD: agroassure

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      # Node 24: the field-core suite drives the device store through
      # node:sqlite, which is not available on Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the shared packages
        run: |
          pnpm --filter @agroassure/domain build
          pnpm --filter @agroassure/field-core build

      - name: Type-check every package
        run: pnpm -r run typecheck

      - name: Unit tests
        run: pnpm -r run test

      - name: Build the regulator console
        run: pnpm --filter @agroassure/console run build

      - name: Apply migrations (forward-only) and the pilot fixture
        run: node db/migrate.mjs --seed

      - name: Migrations are idempotent to re-run
        run: node db/migrate.mjs

      - name: Schema invariants hold against a real database
        run: node db/verify-invariants.mjs

      # A separate, disposable database: the lifecycle suite appends events that
      # cannot be deleted afterwards and rebuilds every projection.
      - name: Prepare a disposable database for the lifecycle suite
        run: |
          psql -h localhost -U agroassure -d agroassure -c 'CREATE DATABASE agroassure_it'
          DATABASE_URL=postgres://agroassure:agroassure@localhost:5432/agroassure_it \
            node db/migrate.mjs

      - name: A full inspection lifecycle, device to public page
        env:
          DATABASE_URL: postgres://agroassure:agroassure@localhost:5432/agroassure_it
          ALLOW_DESTRUCTIVE_TEST_DB: "1"
          EVIDENCE_S3_ENDPOINT: http://localhost:9000
          EVIDENCE_S3_ACCESS_KEY_ID: agroassure
          EVIDENCE_S3_SECRET_ACCESS_KEY: agroassure-local-verification
        run: pnpm --filter @agroassure/sync-gateway run test:integration

  # The gateway ships as a container, so the container is built here. A
  # Dockerfile that is only read and never run is a deployment waiting to fail
  # on a path that does not exist, and this repository has no Docker on the
  # machine it is written on.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: agroassure-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Booting it proves rather more than building it: that the entrypoint
      # resolves, that the workspace links survived into the runtime stage, and
      # that the migration runner is actually present in the image. It is
      # expected to fail on the database, and the message it fails with is the
      # evidence that everything before that worked.
      - name: The image starts and reaches its database check
        run: |
          set -o pipefail
          docker run --rm             -e DATABASE_URL=postgres://nobody@127.0.0.1:1/nothing             -e AUTH_JWT_SECRET=ci-secret-not-used-in-production             agroassure-gateway:ci 2>&1 | tee boot.log || true
          grep -qiE "ECONNREFUSED|connect|database" boot.log

      - name: The migration runner is in the image and refuses to run blind
        run: |
          docker run --rm --entrypoint node agroassure-gateway:ci db/migrate.mjs 2>&1             | grep -q "DATABASE_URL is required"
